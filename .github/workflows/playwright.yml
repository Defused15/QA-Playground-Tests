name: Playwright E2E Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly test run: Mondays at 6:00 AM UTC
    - cron: '0 5 1 * *'  # Monthly keepalive (see `keepalive` job below)

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

# One run per pull request or branch. A new push to a pull request cancels
# its superseded run; runs on main queue instead, so every publish to Pages
# and the QA Hub finishes. Pull requests are grouped by number, not by ref:
# an event that arrives after its PR was merged no longer has a PR ref and
# must never land in main's group, where it would cancel main's runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast static checks: lint (ESLint + Google config), types and formatting.
  quality:
    if: github.event.schedule != '0 5 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Check formatting
        run: npm run format:check

      - name: Check Playwright image matches the installed version
        run: npm run check:playwright-image

  # One job per browser, in parallel. Each writes a blob report that the
  # `report` job merges. Workers stay at 1 per job (3 sessions in total)
  # to keep the load on the shared external site low.
  e2e-tests:
    # Skip the full suite on the monthly keepalive tick.
    if: github.event.schedule != '0 5 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Official Playwright image: Ubuntu 24.04 with the browsers and their
    # system dependencies preinstalled, the same image that records the
    # visual baselines (npm run test:visual:update). The tag must match
    # @playwright/test; the quality job checks it. Runs as the runner's
    # uid so Firefox doesn't refuse to start as root, and shares the host
    # IPC namespace so Chromium doesn't run out of shared memory.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001 --ipc=host
    env:
      # Enables the pixel comparisons (see ignoreSnapshots in the config).
      PW_VISUAL: '1'
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Failures don't stop the job: the merged report is still published,
      # and the `report` job fails the run afterwards.
      - name: Run Playwright tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }} --reporter=blob
        continue-on-error: true

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 1

  # Merges the per-browser results, builds the report page, publishes it
  # (main only) and fails the run if any test failed.
  report:
    needs: e2e-tests
    if: always() && needs.e2e-tests.result != 'skipped' && needs.e2e-tests.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # Required so peaceiris/actions-gh-pages can push to the gh-pages branch
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      # Produces the native HTML report and the JSON the page and the Hub read.
      - name: Merge reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/report.json
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

      # site/: index.html + assets, attachments (screenshots, videos, traces)
      # and the native HTML report under site/playwright/ (without report.json)
      - name: Build report page
        run: npm run report:build -- playwright-report/report.json site

      - name: Upload reports as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Only site/ is published, and only from main (never from PRs or dev):
      #   Report page:       https://defused15.github.io/QA-Playground-Tests/
      #   Raw native report: https://defused15.github.io/QA-Playground-Tests/playwright/
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Keeps the gh-pages branch history clean (single orphan commit)
          force_orphan: true

      # Same rule as Pages: PR and dev runs must never replace the published
      # report on the QA Hub (it drives the live status badge).
      - name: Push report to QA Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: ./.github/actions/playwright-report-hub
        with:
          hub_token: ${{ secrets.HUB_TOKEN }}
          hub_repo: Defused15/test-hub
          project_name: QA-Playground-Tests

      # Fail AFTER publishing, so a red run still has a report to inspect:
      # no tests ran, any test failed, or an executed test has no test.step.
      - name: Check test results
        run: npm run check:results -- playwright-report/report.json

  # Checks the report page itself (build script, layout, keyboard, touch,
  # contrast, escaping) against fixture data. No external sites involved.
  report-ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run report page tests
        run: npm run test:report

      - name: Upload report page test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-page-tests
          path: test-results/
          retention-days: 14

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API resets that timer
  # without creating commits.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 5 1 * *'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/playwright.yml/enable"
          echo "Workflow keepalive sent"
