name: Playwright E2E Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'  # Weekly test run: Mondays at 6:00 AM UTC
    - cron: '0 5 1 * *'  # Monthly keepalive (see `keepalive` job below)

# Least privilege by default; jobs widen only what they need.
permissions:
  contents: read

jobs:
  e2e-tests:
    # Skip the full suite on the monthly keepalive tick.
    if: github.event.schedule != '0 5 1 * *'
    # Pinned: ubuntu-latest moved to 26.04, and the Linux visual baselines in
    # __snapshots__ were recorded on 24.04. Bump together with a baseline refresh.
    runs-on: ubuntu-24.04

    # Required so peaceiris/actions-gh-pages can push to the gh-pages branch
    permissions:
      contents: write

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5️⃣ Run tests — outputs native HTML report + JSON (JSON is what we need)
      - name: Run Playwright Tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report/report.json
        run: npx playwright test --reporter=html,json
        continue-on-error: true   # don't abort the job on failures; we still want the report

      # 6️⃣ Build the static report page from the JSON output into site/:
      #    index.html + assets, attachments (screenshots, videos, traces) and
      #    the native HTML report under site/playwright/ (without report.json)
      - name: Build report page
        if: always() && hashFiles('playwright-report/report.json') != ''
        run: npm run report:build -- playwright-report/report.json site

      # 7️⃣ Upload the full report folder as a downloadable artifact
      - name: Upload reports as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # 8️⃣ Deploy to GitHub Pages (main branch only). Only site/ is published:
      #    Report page:       https://defused15.github.io/QA-Playground-Tests/
      #    Raw native report: https://defused15.github.io/QA-Playground-Tests/playwright/
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          # Keeps the gh-pages branch history clean (single orphan commit)
          force_orphan: true

      # 9️⃣ Fail the job AFTER publishing the report if any tests failed
      - name: Check test results
        run: |
          if [ -f ./playwright-report/report.json ]; then
            UNEXPECTED=$(node -e "
              const r = JSON.parse(require('fs').readFileSync('./playwright-report/report.json'));
              console.log(r.stats?.unexpected ?? 0);
            ")
            if [ "$UNEXPECTED" -gt "0" ]; then
              echo "❌ $UNEXPECTED test(s) failed"
              exit 1
            fi
          fi

      # 🔟 Push report to QA Hub so the combined dashboard picks it up
      - name: Playwright Report & Push to QA Hub
        if: always()
        uses: ./.github/actions/playwright-report-hub
        with:
          hub_token: ${{ secrets.HUB_TOKEN }}
          hub_repo: Defused15/test-hub
          project_name: QA-Playground-Tests

  # Checks the report page itself (build script, layout, keyboard, touch,
  # contrast, escaping) against fixture data. No external sites involved.
  report-ui:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (Chromium and WebKit)
        run: npx playwright install --with-deps chromium webkit

      - name: Run report page tests
        run: npm run test:report

      - name: Upload report page test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-page-tests
          path: test-results/
          retention-days: 14

  # GitHub disables scheduled workflows after 60 days without repository
  # activity. Re-enabling the workflow through the API resets that timer
  # without creating commits.
  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '0 5 1 * *'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/playwright.yml/enable"
          echo "Workflow keepalive sent"
