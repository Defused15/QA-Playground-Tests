# Keeps the SHA-pinned actions and the dev dependencies current with one
# grouped pull request per ecosystem each month.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # ESLint 9+ needs flat config, which eslint-config-google doesn't support.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Bumped by hand together with the Docker image tag and the visual
      # baselines (npm run check:playwright-image enforces the match).
      - dependency-name: '@playwright/test'
      # Major versions track the Node runtime (.nvmrc); bump them together.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
